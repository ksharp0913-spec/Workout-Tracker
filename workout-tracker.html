<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Workout" />
<meta name="theme-color" content="#ffffff" />
<title>Workout Tracker</title>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f5f5f5;
  --bg3: #ebebeb;
  --text: #111111;
  --text2: #555555;
  --text3: #999999;
  --border: rgba(0,0,0,0.1);
  --border2: rgba(0,0,0,0.18);
  --green: #1D9E75;
  --green-light: #E1F5EE;
  --green-text: #0F6E56;
  --amber: #BA7517;
  --amber-light: #FAEEDA;
  --red: #E24B4A;
  --red-light: #FCEBEB;
  --radius: 12px;
  --radius-sm: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a1a;
    --bg2: #252525;
    --bg3: #333333;
    --text: #f0f0f0;
    --text2: #aaaaaa;
    --text3: #666666;
    --border: rgba(255,255,255,0.1);
    --border2: rgba(255,255,255,0.18);
    --green-light: #0a3326;
    --green-text: #5DCAA5;
    --amber-light: #2e1e00;
    --red-light: #2e0a0a;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg2); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; color: var(--text); }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* Top nav */
.nav { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: calc(var(--safe-top) + 14px) 16px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.nav h1 { font-size: 18px; font-weight: 600; flex: 1; }
.nav-icon { font-size: 22px; }

/* Tab bar */
.tab-bar { display: flex; background: var(--bg); border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.tab { flex: 1; padding: 10px 0; font-size: 13px; font-weight: 500; color: var(--text3); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab.active { color: var(--green); border-bottom-color: var(--green); }

/* Scroll area */
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px calc(var(--safe-bot) + 80px); }

/* Cards */
.card { background: var(--bg); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 0.5px solid var(--border); }
.card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 10px; }

/* Summary grid */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.metric { background: var(--bg2); border-radius: var(--radius-sm); padding: 10px 12px; }
.metric-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.metric-value { font-size: 20px; font-weight: 600; color: var(--text); }
.metric-unit { font-size: 11px; font-weight: 400; }

/* Inputs */
input[type="text"], input[type="date"], input[type="number"], select {
  background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text); font-size: 15px; font-family: inherit;
  padding: 10px 12px; width: 100%; outline: none; -webkit-appearance: none;
}
input:focus, select:focus { border-color: var(--green); }
.meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }

/* Rest timer */
.timer-card { background: var(--bg); border-radius: var(--radius); border: 0.5px solid var(--border); margin-bottom: 10px; overflow: hidden; }
.timer-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
.timer-title { font-size: 13px; font-weight: 600; color: var(--text); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.preset { font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text2); cursor: pointer; transition: all 0.12s; }
.preset.active { background: var(--green); color: #fff; border-color: var(--green); }
.timer-body { display: flex; align-items: center; gap: 16px; padding: 10px 14px 14px; }
.ring-wrap { position: relative; width: 76px; height: 76px; flex-shrink: 0; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--border2); stroke-width: 4; }
.ring-prog { fill: none; stroke: var(--green); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.9s linear, stroke 0.3s; }
.ring-prog.warn { stroke: var(--amber); }
.ring-prog.danger { stroke: var(--red); }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-time { font-size: 17px; font-weight: 600; color: var(--text); }
.ring-sub { font-size: 10px; color: var(--text3); margin-top: 1px; }
.timer-info { flex: 1; }
.timer-status { font-size: 13px; color: var(--text2); margin-bottom: 8px; line-height: 1.4; }
.timer-status strong { color: var(--text); }
.timer-btns { display: flex; gap: 6px; margin-bottom: 8px; }
.t-btn { font-size: 13px; padding: 7px 14px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.12s; }
.t-btn:active { opacity: 0.7; transform: scale(0.97); }
.t-btn.primary { background: var(--green); color: #fff; border-color: var(--green); }
.custom-row { display: flex; align-items: center; gap: 6px; }
.custom-row input { width: 64px; padding: 6px 8px; font-size: 13px; }
.custom-row span { font-size: 13px; color: var(--text2); }
.custom-row button { font-size: 12px; padding: 6px 10px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text); cursor: pointer; }

/* Exercise blocks */
.ex-block { background: var(--bg); border-radius: var(--radius); margin-bottom: 10px; border: 0.5px solid var(--border); overflow: hidden; }
.ex-header { display: flex; align-items: center; gap: 8px; padding: 11px 14px; background: var(--bg2); border-bottom: 0.5px solid var(--border); }
.ex-header input { flex: 1; background: transparent; border: none; font-size: 15px; font-weight: 600; color: var(--text); outline: none; padding: 0; }
.ex-header input::placeholder { color: var(--text3); font-weight: 400; }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--text3); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 18px; transition: background 0.12s; flex-shrink: 0; }
.icon-btn:active { background: var(--bg3); }

/* Sets table */
.sets-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 340px; }
thead th { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); padding: 7px 6px; text-align: left; border-bottom: 0.5px solid var(--border); }
thead th:first-child { padding-left: 14px; }
thead th:last-child { padding-right: 14px; }
tbody tr { border-bottom: 0.5px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
td { padding: 5px 6px; vertical-align: middle; }
td:first-child { padding-left: 14px; }
td:last-child { padding-right: 14px; }
.set-num { font-size: 13px; color: var(--text3); font-weight: 500; }
td input[type="number"] { padding: 7px 6px; font-size: 14px; text-align: center; width: 62px; }
td select { padding: 7px 6px; font-size: 13px; width: 100%; min-width: 110px; }
td input[type="text"] { padding: 7px 8px; font-size: 13px; }
.done-btn { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border2); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--text3); transition: all 0.15s; }
.done-btn.done { background: var(--green); border-color: var(--green); color: #fff; }
.add-set-row td { padding: 8px 14px; }
.add-set-btn { font-size: 13px; color: var(--text2); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 0; }
.add-set-btn:active { opacity: 0.6; }

/* Bottom action bar */
.action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 0.5px solid var(--border); padding: 10px 14px calc(var(--safe-bot) + 10px); display: flex; gap: 10px; }
.action-bar button { flex: 1; padding: 13px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: all 0.12s; }
.action-bar button:active { transform: scale(0.97); opacity: 0.85; }
.btn-save { background: var(--green); color: #fff; }
.btn-clear { background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border2) !important; font-weight: 500; }

/* History */
.history-entry { padding: 12px 0; border-bottom: 0.5px solid var(--border); }
.history-entry:last-child { border-bottom: none; }
.h-date { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
.h-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.h-detail { font-size: 13px; color: var(--text2); line-height: 1.5; }
.empty { text-align: center; padding: 2.5rem 1rem; color: var(--text3); font-size: 14px; line-height: 1.6; }

/* Flash animation */
@keyframes flashGreen { 0%,100%{background:transparent} 50%{background:var(--green-light)} }
.flash { animation: flashGreen 0.5s ease; }

/* Toast */
.toast { position: fixed; top: calc(var(--safe-top) + 70px); left: 50%; transform: translateX(-50%) translateY(-10px); background: #111; color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap; z-index: 999; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div class="nav">
    <span class="nav-icon">🏋️</span>
    <h1>Workout Tracker</h1>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('log',this)">Log</button>
    <button class="tab" onclick="switchTab('history',this)">History</button>
  </div>

  <div class="scroll" id="tab-log">
    <div class="card">
      <div class="card-label">Session</div>
      <div class="meta-row">
        <input type="text" id="workout-name" placeholder="Workout name" />
        <input type="date" id="workout-date" />
      </div>
      <div class="summary-grid">
        <div class="metric"><div class="metric-label">Exercises</div><div class="metric-value" id="m-ex">0</div></div>
        <div class="metric"><div class="metric-label">Total sets</div><div class="metric-value" id="m-sets">0</div></div>
        <div class="metric"><div class="metric-label">Sets done</div><div class="metric-value" id="m-done">0</div></div>
        <div class="metric"><div class="metric-label">Volume</div><div class="metric-value" id="m-vol">0<span class="metric-unit"> lbs</span></div></div>
      </div>
    </div>

    <div class="timer-card">
      <div class="timer-head">
        <span class="timer-title">⏱ Rest timer</span>
        <div class="presets" id="presets">
          <button class="preset active" onclick="setPreset(60,this)">1 min</button>
          <button class="preset" onclick="setPreset(90,this)">90s</button>
          <button class="preset" onclick="setPreset(120,this)">2 min</button>
          <button class="preset" onclick="setPreset(180,this)">3 min</button>
        </div>
      </div>
      <div class="timer-body">
        <div class="ring-wrap">
          <svg width="76" height="76" viewBox="0 0 76 76">
            <circle class="ring-track" cx="38" cy="38" r="32"/>
            <circle class="ring-prog" id="ring" cx="38" cy="38" r="32" stroke-dasharray="201.1" stroke-dashoffset="0"/>
          </svg>
          <div class="ring-center">
            <span class="ring-time" id="t-display">1:00</span>
            <span class="ring-sub" id="t-sub">ready</span>
          </div>
        </div>
        <div class="timer-info">
          <div class="timer-status" id="t-status">Check off a set to auto-start.</div>
          <div class="timer-btns">
            <button class="t-btn primary" id="btn-start" onclick="startTimer()">▶ Start</button>
            <button class="t-btn" id="btn-pause" onclick="pauseTimer()" style="display:none">⏸ Pause</button>
            <button class="t-btn" onclick="resetTimer()">↺</button>
          </div>
          <div class="custom-row">
            <input type="number" id="custom-sec" min="5" max="600" step="5" value="60" />
            <span>sec</span>
            <button onclick="applyCustom()">Set</button>
          </div>
        </div>
      </div>
    </div>

    <div id="exercises"></div>

    <button class="t-btn" onclick="addExercise()" style="margin-bottom:80px;width:100%;justify-content:center;font-size:15px;padding:12px;">
      + Add exercise
    </button>
  </div>

  <div class="scroll" id="tab-history" style="display:none;">
    <div class="card" id="history-list">
      <div class="empty">No workouts saved yet.<br>Log and save your first session!</div>
    </div>
  </div>

  <div class="action-bar" id="action-bar">
    <button class="btn-clear" onclick="clearWorkout()">Clear</button>
    <button class="btn-save" onclick="saveWorkout()">💾 Save Workout</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CIRC = 2 * Math.PI * 32;
let exercises = [], history = [], exId = 0, setId = 0;
let tDur = 60, tRem = 60, tInterval = null, tRunning = false;

const noteOpts = [
  {v:'',l:'— note —'},
  {v:'easy',l:'Easy — increase weight'},
  {v:'normal',l:'Normal — on track'},
  {v:'hard',l:'Hard — keep weight'},
  {v:'failed',l:'Failed — reduce weight'},
  {v:'custom',l:'Custom...'}
];

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-log').style.display = tab === 'log' ? '' : 'none';
  document.getElementById('tab-history').style.display = tab === 'history' ? '' : 'none';
  document.getElementById('action-bar').style.display = tab === 'log' ? '' : 'none';
  if (tab === 'history') renderHistory();
}

// Timer
function setPreset(s, btn) {
  document.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  tDur = s; tRem = s;
  document.getElementById('custom-sec').value = s;
  if (!tRunning) updateTimerDisplay();
}
function applyCustom() {
  const v = parseInt(document.getElementById('custom-sec').value) || 60;
  tDur = Math.max(5, Math.min(600, v)); tRem = tDur;
  document.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
  if (!tRunning) updateTimerDisplay();
}
function startTimer() {
  if (tRunning) return;
  if (tRem <= 0) tRem = tDur;
  tRunning = true;
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-pause').style.display = '';
  document.getElementById('t-sub').textContent = 'resting';
  tInterval = setInterval(tick, 1000);
  updateTimerDisplay();
}
function pauseTimer() {
  if (!tRunning) return;
  tRunning = false;
  clearInterval(tInterval);
  document.getElementById('btn-start').style.display = '';
  document.getElementById('btn-pause').style.display = 'none';
  document.getElementById('t-sub').textContent = 'paused';
}
function resetTimer() {
  pauseTimer(); tRem = tDur;
  document.getElementById('t-sub').textContent = 'ready';
  document.getElementById('t-status').textContent = 'Check off a set to auto-start.';
  updateTimerDisplay();
}
function tick() {
  tRem--;
  updateTimerDisplay();
  if (tRem <= 0) {
    clearInterval(tInterval); tRunning = false;
    document.getElementById('btn-start').style.display = '';
    document.getElementById('btn-pause').style.display = 'none';
    document.getElementById('t-sub').textContent = 'done!';
    document.getElementById('t-status').innerHTML = '<strong>Rest complete!</strong> Time for your next set.';
    try {
      const ctx = new AudioContext();
      [0, 0.15, 0.3].forEach((t, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = i === 2 ? 1046 : 880;
        g.gain.setValueAtTime(0.25, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
      });
    } catch(e) {}
  }
}
function updateTimerDisplay() {
  const m = Math.floor(tRem / 60), s = tRem % 60;
  document.getElementById('t-display').textContent = m + ':' + String(s).padStart(2,'0');
  const pct = tDur > 0 ? tRem / tDur : 0;
  const ring = document.getElementById('ring');
  ring.style.strokeDashoffset = CIRC * (1 - pct);
  ring.className = 'ring-prog' + (pct < 0.2 ? ' danger' : pct < 0.4 ? ' warn' : '');
  if (tRunning) {
    const elapsed = tDur - tRem;
    document.getElementById('t-status').innerHTML = '<strong>' + fmt(tRem) + '</strong> remaining · ' + fmt(elapsed) + ' elapsed';
  }
}
function fmt(s) { return s < 60 ? s + 's' : Math.floor(s/60) + 'm ' + (s%60) + 's'; }
function autoStartRest() {
  resetTimer(); startTimer();
  document.getElementById('t-status').innerHTML = 'Rest started. <strong>' + fmt(tRem) + '</strong> remaining.';
}

// Exercises
function addExercise() {
  const id = ++exId;
  exercises.push({id, name:'', sets:[]});
  addSet(id, false);
  renderExercises(); updateSummary();
}
function removeExercise(id) {
  exercises = exercises.filter(e => e.id !== id);
  renderExercises(); updateSummary();
}
function addSet(exId, render=true) {
  const ex = exercises.find(e => e.id === exId);
  if (!ex) return;
  ex.sets.push({id:++setId, weight:'', reps:'', note:'', noteCustom:'', done:false});
  if (render) { renderExercises(); updateSummary(); }
}
function removeSet(exId, sid) {
  const ex = exercises.find(e => e.id === exId);
  if (ex) ex.sets = ex.sets.filter(s => s.id !== sid);
  renderExercises(); updateSummary();
}
function upd(exId, sid, field, val) {
  const ex = exercises.find(e => e.id === exId);
  if (!ex) return;
  const s = ex.sets.find(s => s.id === sid);
  if (s) { s[field] = val; updateSummary(); }
}
function updName(id, val) {
  const ex = exercises.find(e => e.id === id);
  if (ex) ex.name = val;
}
function toggleDone(exId, sid) {
  const ex = exercises.find(e => e.id === exId);
  if (!ex) return;
  const s = ex.sets.find(s => s.id === sid);
  if (!s) return;
  s.done = !s.done;
  const btn = document.getElementById('d-'+sid);
  if (btn) {
    btn.classList.toggle('done', s.done);
    btn.textContent = s.done ? '✓' : '';
    if (s.done) {
      const row = btn.closest('tr');
      if (row) { row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 600); }
      autoStartRest();
    }
  }
  updateSummary();
}
function handleNote(exId, sid, val, sel) {
  if (val === 'custom') {
    sel.style.display = 'none';
    const ci = document.getElementById('nc-'+sid);
    if (ci) { ci.style.display = ''; ci.focus(); }
    upd(exId, sid, 'note', 'custom');
  } else { upd(exId, sid, 'note', val); }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderExercises() {
  document.getElementById('exercises').innerHTML = exercises.map(ex => `
    <div class="ex-block">
      <div class="ex-header">
        <input type="text" placeholder="Exercise name" value="${esc(ex.name)}" oninput="updName(${ex.id},this.value)" />
        <button class="icon-btn" onclick="removeExercise(${ex.id})" aria-label="Remove">✕</button>
      </div>
      <div class="sets-wrap">
        <table>
          <thead><tr>
            <th style="width:26px">#</th>
            <th style="width:70px">Weight</th>
            <th style="width:62px">Reps</th>
            <th>Notes</th>
            <th style="width:32px"></th>
            <th style="width:28px"></th>
          </tr></thead>
          <tbody>
            ${ex.sets.map((s,i) => `<tr>
              <td><span class="set-num">${i+1}</span></td>
              <td><input type="number" min="0" step="2.5" placeholder="lbs" value="${esc(s.weight)}" oninput="upd(${ex.id},${s.id},'weight',this.value)" /></td>
              <td><input type="number" min="0" step="1" placeholder="reps" value="${esc(s.reps)}" oninput="upd(${ex.id},${s.id},'reps',this.value)" /></td>
              <td>${s.note==='custom'
                ? `<input type="text" id="nc-${s.id}" placeholder="Note..." value="${esc(s.noteCustom)}" oninput="upd(${ex.id},${s.id},'noteCustom',this.value)" />`
                : `<select onchange="handleNote(${ex.id},${s.id},this.value,this)">
                    ${noteOpts.map(o=>`<option value="${o.v}"${s.note===o.v?' selected':''}>${o.l}</option>`).join('')}
                  </select>
                  <input type="text" id="nc-${s.id}" placeholder="Note..." value="${esc(s.noteCustom)}" oninput="upd(${ex.id},${s.id},'noteCustom',this.value)" style="display:none" />`
              }</td>
              <td><button id="d-${s.id}" class="done-btn${s.done?' done':''}" onclick="toggleDone(${ex.id},${s.id})">${s.done?'✓':''}</button></td>
              <td><button class="icon-btn" onclick="removeSet(${ex.id},${s.id})" style="font-size:15px;">−</button></td>
            </tr>`).join('')}
          </tbody>
          <tfoot><tr class="add-set-row"><td colspan="6">
            <button class="add-set-btn" onclick="addSet(${ex.id})">+ Add set</button>
          </td></tr></tfoot>
        </table>
      </div>
    </div>`).join('');
}

function updateSummary() {
  let sets=0, done=0, vol=0;
  exercises.forEach(ex => {
    sets += ex.sets.length;
    ex.sets.forEach(s => {
      if (s.done) done++;
      vol += (parseFloat(s.weight)||0) * (parseInt(s.reps)||0);
    });
  });
  document.getElementById('m-ex').textContent = exercises.length;
  document.getElementById('m-sets').textContent = sets;
  document.getElementById('m-done').textContent = done;
  document.getElementById('m-vol').innerHTML = Math.round(vol).toLocaleString() + '<span class="metric-unit"> lbs</span>';
}

function saveWorkout() {
  if (!exercises.length) { toast('Add an exercise first!'); return; }
  const name = document.getElementById('workout-name').value.trim() || 'Workout';
  const date = document.getElementById('workout-date').value || new Date().toISOString().slice(0,10);
  history.unshift({id:Date.now(), name, date, exercises: JSON.parse(JSON.stringify(exercises))});
  try { localStorage.setItem('wt_history', JSON.stringify(history)); } catch(e){}
  toast('✓ ' + name + ' saved!');
}

function clearWorkout() {
  if (exercises.length && !confirm('Clear current workout?')) return;
  exercises = [];
  document.getElementById('workout-name').value = '';
  renderExercises(); updateSummary(); resetTimer();
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!history.length) { el.innerHTML = '<div class="empty">No workouts saved yet.<br>Log and save your first session!</div>'; return; }
  el.innerHTML = history.map(w => {
    const d = new Date(w.date+'T12:00:00');
    const ds = d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    const detail = w.exercises.map(e => {
      const vol = e.sets.reduce((a,s)=>a+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0);
      return `${e.name||'Exercise'}: ${e.sets.length} sets · ${Math.round(vol).toLocaleString()} lbs`;
    }).join('<br>');
    return `<div class="history-entry"><div class="h-date">${ds}</div><div class="h-name">${esc(w.name)}</div><div class="h-detail">${detail}</div></div>`;
  }).join('');
}

// Init
document.getElementById('workout-date').value = new Date().toISOString().slice(0,10);
try { const saved = localStorage.getItem('wt_history'); if (saved) history = JSON.parse(saved); } catch(e){}
updateTimerDisplay();
addExercise();
</script>
</body>
